name: NewAl-Cloud — exact Action #43 + cloud heart
on:
  push:
    branches: ["merge/action43-cloud", "musabai-v2-superagent"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout NewAl-Cloud
        uses: actions/checkout@v4
      - name: Checkout exact Action #43 source
        uses: actions/checkout@v4
        with:
          repository: Musabgpt/NewAl
          ref: ccr-e40af0a0-eec37q
          path: newal-source
          fetch-depth: 1
      - name: Install Android SDK + NDK
        run: |
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME" -type f -name sdkmanager | sort | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "ndk;27.3.13750724" >/dev/null
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/27.3.13750724" >> "$GITHUB_ENV"
      - name: Supply exact Action #43 Python engine
        run: |
          rm -rf /tmp/newal-autonomy
          cp -a desktop/autonomy /tmp/newal-autonomy
          rm -rf desktop
          cp -a newal-source/desktop .
          test -f desktop/newal_code/agent.py
          test -f desktop/newal_code/server.py
          test -f desktop/newal_code/tools.py
      - name: Apply MusabAI mobile UI layer
        run: |
          test -f app/src/main/assets/index.html
          test -f app/src/main/assets/app.js
          test -f app/src/main/assets/style.css
          cp app/src/main/assets/index.html desktop/newal_code/ui/index.html
          cp app/src/main/assets/app.js desktop/newal_code/ui/app.js
          cp app/src/main/assets/style.css desktop/newal_code/ui/style.css
          grep -n "MusabAI Hub" desktop/newal_code/ui/index.html
          grep -n "MusabAI" desktop/newal_code/ui/app.js
      - name: Apply standalone Cloud Workspace layer
        run: |
          python3 newal-autonomy/apply_cloud_session.py
          python3 -m py_compile desktop/newal_code/server.py
          grep -n "standalone Cloud Session" desktop/newal_code/server.py
          grep -n "/api/cloud/workspace" desktop/newal_code/server.py
      - name: Apply autonomous memory and self-evolution layer
        run: |
          cp -a /tmp/newal-autonomy/. newal-autonomy/
          cp -a /tmp/newal-autonomy/autonomy.py desktop/newal_code/autonomy.py
          python3 newal-autonomy/apply_autonomy.py desktop/newal_code/agent.py
          python3 -m py_compile desktop/newal_code/autonomy.py desktop/newal_code/agent.py desktop/newal_code/tools.py
          grep -n "NEWAL_CLOUD_AUTONOMY_V1" desktop/newal_code/agent.py
          grep -n "memory_recall" desktop/newal_code/tools.py
          grep -n "self_evolve" desktop/newal_code/tools.py
      - name: Verify cloud heart
        run: grep -n "kilo-auto/free" android-lite/app/src/main/java/dev/newal/code/lite/Setup.java
      - name: Prepare exact Action #43 Android runtime
        run: |
          chmod +x android-lite/native/prepare.sh
          android-lite/native/prepare.sh arm64-v8a x86_64
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build exact Action #43 APK
        run: |
          gradle -p android-lite :app:assembleRelease --stacktrace
          cp android-lite/app/build/outputs/apk/release/app-release.apk MusabAI-Action43.apk
          ls -lh MusabAI-Action43.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MusabAI-Action43
          path: MusabAI-Action43.apk
          compression-level: 0
          retention-days: 14
