description: MusabAI Phase 7 deterministic routing contracts
prompts:
  - "{{task}}"
providers:
  - "exec: python3 connectors/promptfoo_provider.py"
tests:
  - vars:
      task: "Build and test this Android APK in Termux"
    assert:
      - type: contains
        value: "termux_exec"
      - type: contains
        value: "execution_plan"
  - vars:
      task: "Inspect the git repository diff before committing"
    assert:
      - type: contains
        value: "git_status"
      - type: contains
        value: "git_diff"
  - vars:
      task: "Search the web and inspect the current project before editing code"
    assert:
      - type: contains
        value: "search_router"
      - type: contains
        value: "project_rag_search"
